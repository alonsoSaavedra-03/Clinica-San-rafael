<header class="portal-header">
  <div class="container-fluid portal-header-inner">
    <!-- Logotipo y Nombre del Portal -->
    <div class="portal-brand-wrap">
      <a routerLink="/" class="portal-logo-link" title="Ir al Sitio Web">
        <div class="portal-logo-symbol">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none">
            <path d="M50 8C72 8 86 16 86 36C86 64 50 92 50 92C50 92 14 64 14 36C14 16 28 8 50 8Z" fill="#1B365D"/>
            <path d="M50 20C64 20 74 27 74 42C74 60 50 78 50 78C50 78 26 60 26 42C26 27 36 20 50 20Z" fill="#244575"/>
            <rect x="44" y="30" width="12" height="30" rx="3" fill="#E63946"/>
            <rect x="35" y="39" width="30" height="12" rx="3" fill="#E63946"/>
            <circle cx="50" cy="45" r="3.5" fill="#FFFFFF"/>
          </svg>
        </div>
        <div class="portal-brand-text">
          <span class="portal-clinic-name">Clínica San Rafael</span>
          <span class="portal-system-tag">{{ portalSubtitle }}</span>
        </div>
      </a>

      <div class="portal-title-divider"></div>

      <div class="portal-badge-wrap">
        <span class="portal-badge">{{ portalTitle }}</span>
      </div>
    </div>

    <!-- Zona Derecha: Enlace al Sitio Web, Perfil y Cerrar Sesión -->
    <div class="portal-actions-wrap" *ngIf="currentUser$ | async as user">
      <!-- Enlace para volver a la web pública -->
      <a routerLink="/" class="btn-portal-website">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Sitio Web Principal</span>
      </a>

      <!-- Chip del Usuario Conectado -->
      <div class="portal-user-chip">
        <div class="portal-user-avatar">
          <img *ngIf="user.avatar_url" [src]="user.avatar_url" [alt]="user.name" class="portal-avatar-img">
          <span *ngIf="!user.avatar_url">{{ user.name.charAt(0) }}</span>
        </div>
        <div class="portal-user-info">
          <span class="portal-user-name">{{ user.name }}</span>
          <span class="portal-user-role">{{ user.role | titlecase }}</span>
        </div>
      </div>

      <!-- Botón Salir -->
      <button type="button" class="btn-portal-logout" (click)="logout()" title="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </div>
</header>
